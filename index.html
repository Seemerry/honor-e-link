<!doctype html>
<html lang="zh-CN" data-app-version="3">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f8f8f8">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Honor E Link">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Honor E Link 我的团队">
  <title>Honor E Link</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=3">
  <script src="./app.js?v=3" defer></script>
</head>
<body>
  <div class="app">
    <section id="teams-view" class="app-view" aria-label="我的团队">
    <!-- iOS supplies its own live status bar and home indicator. -->
    <header class="topbar">
      <div class="toolbar">
        <span class="back icon-slot" role="img" aria-label="返回">
          <svg viewBox="0 0 24 32" aria-hidden="true"><path d="M18 3 5 16l13 13"/></svg>
        </span>
        <h1>我的团队</h1>
        <div class="toolbar-actions" aria-label="页面图标">
          <button id="open-search" class="icon-slot search" type="button" aria-label="搜索团队">
            <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="13.8" cy="13.6" r="11.6"/><path d="m22.2 22 7.1 7.2"/></svg>
          </button>
          <button id="open-friends" class="icon-slot add-person" type="button" aria-label="添加好友">
            <svg viewBox="0 0 34 34" aria-hidden="true"><path d="M22 31H3c-1.3 0-1.7-1.1-.9-2.5 1.8-3.2 7.8-5.2 9.1-7.2.9-1.3-.1-2.6-1-3.8C8.4 15.4 8 12.9 8 9.4 8 4.9 10.6 2 14 2s6 2.9 6 7.4c0 3.5-.4 6-2.2 8.1-.9 1.2-1.9 2.5-1 3.8.5.7 1.6 1.4 3 2.2M25 8c2.1 2.5 2.3 6.1.5 9M27.5 22v10M22.5 27h10"/></svg>
          </button>
        </div>
      </div>
    </header>
    <div class="tabs" role="tablist" aria-label="团队分类">
      <button id="managed-tab" class="tab" type="button" role="tab" aria-controls="managed-panel" aria-selected="false" tabindex="-1">我管理的</button>
      <button id="joined-tab" class="tab selected" type="button" role="tab" aria-controls="joined-panel" aria-selected="true">我加入的</button>
    </div>
    <main id="team-pager" class="pager" aria-label="团队页面，可左右滑动">
      <div id="panel-track" class="panel-track">
        <section id="managed-panel" class="team-panel" role="tabpanel" aria-labelledby="managed-tab" aria-hidden="true" inert></section>
        <section id="joined-panel" class="team-panel" role="tabpanel" aria-labelledby="joined-tab">
      <section class="team-list" aria-label="我加入的团队">
        <div class="team-row">
          <svg class="team-avatar" viewBox="0 0 92 92" role="img" aria-label="团队">
            <rect width="92" height="92" rx="25" fill="#eaf7fc"/>
            <path d="M53 26c9-3 15 1 14 11-1 7-3 11-7 14 1 3 9 7 12 10 2 2 3 5 2 7H62c0-8-8-12-12-15 7-8 10-17 3-27Z" fill="#23adeb"/>
            <path d="M42 22c-9 0-14 7-13 16 0 8 4 13 7 16-2 4-13 7-16 13-1 2-1 4 0 5h40c2-1 2-3 1-5-3-6-14-9-16-13 3-4 7-10 7-18 0-8-4-14-10-14Z" fill="#079ee6"/>
          </svg>
          <span class="team-name">荣耀终端有限公司</span>
          <span class="all-members">全员</span>
        </div>
      </section>
      <p class="hint">保存至我的团队的讨论组也会在此显示</p>
        </section>
      </div>
    </main>
    </section>

    <section id="search-view" class="app-view" aria-label="搜索团队" hidden>
      <header class="topbar">
        <div class="toolbar">
          <button class="back icon-slot close-view" type="button" aria-label="返回我的团队">
            <svg viewBox="0 0 24 32" aria-hidden="true"><path d="M18 3 5 16l13 13"/></svg>
          </button>
          <h1>搜索</h1>
        </div>
      </header>
      <form id="team-search-form" class="search-form" role="search">
        <div class="search-field">
          <svg class="field-icon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="13.8" cy="13.6" r="10.6"/><path d="m22 22 7 7"/></svg>
          <input id="team-query" type="search" placeholder="搜索团队" aria-label="搜索团队名称" autocomplete="off" enterkeyhint="search" maxlength="100">
        </div>
        <button class="text-button" type="submit">搜索</button>
      </form>
      <main class="view-body" aria-label="搜索结果">
        <div id="team-results" class="search-results"></div>
        <p id="no-results" class="empty-message" role="status" hidden>没有找到相关团队</p>
      </main>
    </section>

    <section id="friends-view" class="app-view" aria-label="添加好友" hidden>
      <header class="topbar">
        <div class="toolbar">
          <button class="back icon-slot close-view" type="button" aria-label="返回我的团队">
            <svg viewBox="0 0 24 32" aria-hidden="true"><path d="M18 3 5 16l13 13"/></svg>
          </button>
          <h1>添加好友</h1>
        </div>
      </header>
      <main class="view-body">
        <div class="friend-search">
          <div class="search-field">
            <svg class="field-icon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="13.8" cy="13.6" r="10.6"/><path d="m22 22 7 7"/></svg>
            <input id="friend-account" type="search" placeholder="手机号 / 邮箱 / 账号" aria-label="好友手机号、邮箱或账号" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="100">
          </div>
        </div>
        <p class="friend-hint">通过手机号、邮箱或账号查找好友</p>
      </main>
    </section>
  </div>
</body>
</html>
